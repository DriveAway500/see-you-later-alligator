# silly-term configuration
#
# Location:  $XDG_CONFIG_HOME/silly-term/sillyconf.conf
#            (default: ~/.config/silly-term/sillyconf.conf)
# Or run:    silly-term -c /path/to/file.conf
#
# Format:    key = value        (one per line)
# Comments:  lines starting with '#' or ';', or ' #' after a value.
# Values:    "quotes" are optional. Booleans: true/false, yes/no, on/off, 1/0.
#            Colors: #rrggbb or #rgb.
# Numbers outside the allowed range are clamped.
# Every line below shows the built-in default.


# ------------------------------------------------------------------ font
# Empty = try common system fonts (DejaVu Sans Mono, Liberation Mono, Noto...)
# then fontconfig's default monospace. Other installed fonts act as fallback
# for glyphs the main font lacks.
font_path        =
font_size        = 20            # px, 6-200
line_height      = 1.2           # multiplier of font_size, 0.5-3.0
letter_spacing   = 0             # extra px per cell, -10 to 50
font_smooth      = true          # false = crisp 1-bit glyphs
font_step        = 2             # px per zoom shortcut, 1-20

# ---------------------------------------------------------------- window
title            = silly-term
cols             = 80            # initial size, 2-1000
rows             = 24            # initial size, 1-1000
padding          = 4             # px around the grid, 0-200
decorated        = true          # window title bar / borders
resizable        = true
opacity          = 1.0           # 0.0-1.0, background only (needs a compositor)
fps              = 30            # max redraws per second, 5-360
                                 # (frames are only drawn when something changes)

# ------------------------------------------------------ background image
# Empty or missing file = plain background color below.
# PNG, JPEG, BMP, GIF, TGA. "~/" is expanded.
bg_image         =
#bg_image        = ~/Pictures/wallpaper.png
bg_image_mode    = cover         # cover | contain | stretch | center | tile
bg_image_opacity = 1.0           # 0.0-1.0 (also scaled by 'opacity')

# ----------------------------------------------------------------- shell
# Command line, split on spaces (no quoting). Default: $SHELL, else /bin/bash.
#shell           = /bin/zsh
term             = xterm-256color

# ------------------------------------------------------------- scrolling
scrollback       = 10000         # lines kept, 0-1000000
scroll_lines     = 3             # lines per wheel notch, 1-100

# ---------------------------------------------------------------- cursor
cursor_style     = block         # block | underline | bar
cursor_blink     = true
cursor_blink_ms  = 600           # 100-5000
cursor_blink_timeout = 15        # seconds without input before the blink stops
                                 # (0 = blink forever). Lets an idle terminal sleep.
cursor_thickness = 2             # underline/bar thickness in px, 1-20

# ------------------------------------------------------- text / behavior
bold_bright      = true          # bold + colors 0-7 uses colors 8-15
fake_bold        = false         # draw bold glyphs twice, 1px apart
copy_on_select   = false         # copy to clipboard when a drag selection ends
mouse_reporting  = true          # send mouse to apps that ask (vim, tmux, htop)
                                 # hold Shift to select text anyway

# ---------------------------------------------------------------- colors
fg               = #c5c8c6
bg               = #1d1f21
cursor_color     = #c5c8c6
selection_fg     = #ffffff
selection_bg     = #373b41

# 16-color palette (0-7 normal, 8-15 bright)
color0           = #1d1f21
color1           = #cc6666
color2           = #b5bd68
color3           = #f0c674
color4           = #81a2be
color5           = #b294bb
color6           = #8abeb7
color7           = #c5c8c6
color8           = #969896
color9           = #cc6666
color10          = #b5bd68
color11          = #f0c674
color12          = #81a2be
color13          = #b294bb
color14          = #8abeb7
color15          = #ffffff

# -------------------------------------------------------------- keybinds
# Alternatives separated by commas (max 4 per action).
# Modifiers: ctrl, shift, alt. Keys: a-z, 0-9, f1-f12, pageup, pagedown, home,
# end, insert, delete, up, down, left, right, space, enter, tab, backspace,
# equal, plus, minus, comma, period, slash, kp_add, kp_subtract, kp_0.
key_copy             = ctrl+shift+c
key_paste            = ctrl+shift+v, shift+insert
key_select_all       = ctrl+shift+a
key_scroll_up        = shift+pageup
key_scroll_down      = shift+pagedown
key_scroll_top       = shift+home
key_scroll_bottom    = shift+end
key_clear_scrollback = ctrl+shift+k
key_font_increase    = ctrl+equal, ctrl+shift+equal, ctrl+kp_add
key_font_decrease    = ctrl+minus, ctrl+kp_subtract
key_font_reset       = ctrl+0, ctrl+kp_0
key_fullscreen       = f11