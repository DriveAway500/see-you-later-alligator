# silly-term — ~/.config/silly-term/sillyconf.conf
# Format: key = value   (lines starting with # or ; are comments)
# Everything is optional: anything missing falls back to the default shown here.

# ---- font ----------------------------------------------------------------
# empty = try DejaVu Sans Mono / Liberation Mono from the system
font_path      = 
font_size      = 20
line_height    = 1.2        # multiplier of font_size (0.5 - 3.0)
letter_spacing = 0          # extra pixels added to cell width
font_smooth    = true

# ---- window --------------------------------------------------------------
title      = silly-term     # the title can be changed by the running program
cols       = 80
rows       = 24
padding    = 4              # inner margin in pixels
decorated  = true           # false = no title bar / border
resizable  = true
opacity    = 1.0            # 0.0 - 1.0 (background only; needs a compositor)
fps        = 60

# ---- shell ---------------------------------------------------------------
# full command, space-separated. Default: $SHELL
shell = /bin/bash
term  = xterm-256color

# ---- scrolling -----------------------------------------------------------
scrollback   = 10000        # lines kept (0 disables)
scroll_lines = 3            # lines per mouse wheel "click"

# ---- cursor --------------------------------------------------------------
cursor_style     = block    # block | underline | bar
cursor_blink     = true
cursor_blink_ms  = 600
cursor_thickness = 2        # thickness of underline/bar

# ---- text ----------------------------------------------------------------
bold_bright = true          # bold uses colors 8-15 when the color is 0-7
fake_bold   = false         # draw the glyph twice to simulate bold

# ---- selection -----------------------------------------------------------
copy_on_select = false

# ---- colors --------------------------------------------------------------
fg           = #c5c8c6
bg           = #1d1f21
cursor_color = #c5c8c6
selection_fg = #ffffff
selection_bg = #373b41

color0  = #1d1f21
color1  = #cc6666
color2  = #b5bd68
color3  = #f0c674
color4  = #81a2be
color5  = #b294bb
color6  = #8abeb7
color7  = #c5c8c6
color8  = #969896
color9  = #cc6666
color10 = #b5bd68
color11 = #f0c674
color12 = #81a2be
color13 = #b294bb
color14 = #8abeb7
color15 = #ffffff

# ---- keybinds ------------------------------------------------------------
# modifiers: ctrl, shift, alt  |  keys: a-z, 0-9, f1-f12, pageup,
# pagedown, home, end, insert, delete, up, down, left, right, space, enter, tab
key_copy        = ctrl+shift+c
key_paste       = ctrl+shift+v
key_scroll_up   = shift+pageup
key_scroll_down = shift+pagedown