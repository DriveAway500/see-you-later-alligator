# silly-term — ~/.config/silly-term/sillyconf.conf
# Format: key = value   (lines with # or ; are comments)
# Everything is optional: whatever is missing uses the default value shown here.

# ---- font ----------------------------------------------------------------
# empty = tries DejaVu Sans Mono / Liberation Mono from the system
font_path      = 
font_size      = 20
line_height    = 1.2        # font_size multiplier (0.5 - 3.0)
letter_spacing = 0          # extra pixels in cell width
font_smooth    = true
font_step      = 2          # pixels per zoom shortcut

# ---- window --------------------------------------------------------------
title      = silly-term     # the title can be changed by the running program
cols       = 80
rows       = 24
padding    = 4              # inner margin in pixels
decorated  = true           # false = no title bar/border
resizable  = true
opacity    = 1.0            # 0.0 - 1.0 (background only; requires a compositor)
fps        = 60

# ---- shell ---------------------------------------------------------------
# full command, separated by spaces. Default: $SHELL
shell = /bin/bash
term  = xterm-256color

# ---- scroll --------------------------------------------------------------
scrollback   = 10000        # lines kept (0 disables)
scroll_lines = 3            # lines per mouse wheel "click"

# ---- cursor --------------------------------------------------------------
cursor_style     = block    # block | underline | bar
cursor_blink     = true
cursor_blink_ms  = 600
cursor_thickness = 2        # underline/bar thickness

# ---- text ----------------------------------------------------------------
bold_bright = true          # bold uses colors 8-15 when the color is 0-7
fake_bold   = false         # draws the glyph 2x to simulate bold

# ---- mouse ---------------------------------------------------------------
# true = clicks, drags and wheel are sent to apps that request them (vim, tmux,
# htop, mc...). Hold SHIFT to select text locally even so.
mouse_reporting = true
copy_on_select  = false

# ---- colors --------------------------------------------------------------
fg           = #c5c8c6
bg           = #1d1f21
cursor_color = #c5c8c6
selection_fg = #ffffff
selection_bg = #373b41

color0  = #1d1f21
color1  = #cc6666
color2  = #b5bd68
color3  = #f0c674
color4  = #81a2be
color5  = #b294bb
color6  = #8abeb7
color7  = #c5c8c6
color8  = #969896
color9  = #cc6666
color10 = #b5bd68
color11 = #f0c674
color12 = #81a2be
color13 = #b294bb
color14 = #8abeb7
color15 = #ffffff

# ---- shortcuts -----------------------------------------------------------
# Multiple alternatives separated by commas: "ctrl+equal, ctrl+kp_add"
# modifiers: ctrl, shift, alt
# keys: a-z, 0-9, f1-f12, pageup, pagedown, home, end, insert, delete,
#       up, down, left, right, space, enter, tab, backspace,
#       equal (=/+), minus, comma, period, slash, kp_add, kp_subtract, kp_0
key_copy             = ctrl+shift+c
key_paste            = ctrl+shift+v, shift+insert
key_select_all       = ctrl+shift+a
key_scroll_up        = shift+pageup
key_scroll_down      = shift+pagedown
key_scroll_top       = shift+home
key_scroll_bottom    = shift+end
key_clear_scrollback = ctrl+shift+k
key_font_increase    = ctrl+equal, ctrl+shift+equal, ctrl+kp_add
key_font_decrease    = ctrl+minus, ctrl+kp_subtract
key_font_reset       = ctrl+0, ctrl+kp_0
key_fullscreen       = f11